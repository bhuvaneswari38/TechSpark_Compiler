
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSpark Multi-Language Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>TechSpark Compiler</h1>
        <p class="subtitle">Write, run, and test code in four languages.</p>

        <section class="language-section">
            <label for="language">Select Language</label>
            <select id="language">
                <option value="python">Python</option>
                <option value="c">C</option>
                <option value="cpp">C++</option>
                <option value="java">Java</option>
            </select>
        </section>

        <section class="editor-section">
            <label for="editorContainer">Source Code</label>

            <div id="editorContainer"
                role="region"
                aria-label="Source code editor"
                style="height: 420px; width: 100%; overflow: hidden; border-radius: 6px;">
            </div>

            <p class="hint">Monaco Editor supports line numbers, syntax highlighting, and automatic indentation.</p>
        </section>

        <section id="inputSection" class="input-section" hidden>
            <label for="input">Program Input</label>
            <textarea id="input" placeholder="Enter input for your program, one value per line"></textarea>
        </section>

        <div class="button-section">
            <button id="runButton" type="button">Run Code</button>
            <button id="clearButton" class="secondary" type="button">Clear</button>
        </div>

        <section class="output-section">
            <label for="output">Output / Errors</label>
            <pre id="output" aria-live="polite">Program output will appear here...</pre>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
